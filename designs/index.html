<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>blinboyan.github.io — directions</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#15120d;font-family:ui-sans-serif,system-ui,sans-serif;color:#ecdfc8}
  .frame{display:block;width:100%;height:100%;border:0;background:#14110d}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  const Frame = ({ src }) => (
    <iframe className="frame" src={src} title={src} loading="lazy" />
  );

  const App = () => (
    <DesignCanvas>
      <DCSection id="home" title="Home — blinboyan.github.io">
        <DCArtboard id="a-dark" label="Home · Dark" width={700} height={1200}>
          <Frame src="variation-a-terminal.html" />
        </DCArtboard>
        <DCArtboard id="a-light" label="Home · Light" width={700} height={1200}>
          <Frame src="variation-a-light.html" />
        </DCArtboard>
      </DCSection>
      <DCSection id="resume" title="Résumé">
        <DCArtboard id="r-dark" label="Résumé · Dark" width={720} height={2400}>
          <Frame src="resume-dark.html" />
        </DCArtboard>
        <DCArtboard id="r-light" label="Résumé · Light" width={720} height={2400}>
          <Frame src="resume-light.html" />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
